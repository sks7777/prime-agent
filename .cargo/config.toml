# Every cargo test/run in this repo, any profile and any crate, opts out of
# product telemetry. Cargo's [env] never overrides a variable that is
# already set, so a test that needs it can still set its own value.
[env]
DO_NOT_TRACK = "1"

# lld linker: Homebrew lld 23 (LLVM 23) understands the arm64e.x1-macos TAPI
# tokens in the macOS 27 SDK. Rust 1.96 bundles LLD 22.1.2 which cannot parse them.
# Setup: brew install lld && ln -sf /opt/homebrew/opt/lld/bin/ld64.lld ~/.local/bin/ld64.lld
[target.aarch64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
